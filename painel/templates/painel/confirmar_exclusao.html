{% extends 'painel/base_painel.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg" style="border-radius: 15px; overflow: hidden;">
            
            <!-- Cabeçalho Vermelho (Atenção) -->
            <div class="card-header bg-danger text-white py-3 text-center border-0">
                <i class="fas fa-exclamation-triangle fa-3x mb-2"></i>
                <h5 class="mb-0 fw-bold">Confirmar Exclusão</h5>
            </div>
            
            <!-- Corpo com a mensagem -->
            <div class="card-body p-4 text-center">
                <p class="text-muted mb-2" style="font-size: 1.1rem;">Você está prestes a excluir permanentemente:</p>
                <div class="p-3 bg-light rounded border mb-4">
                    <strong class="text-dark" style="font-size: 1.2rem;">"{{ objeto }}"</strong>
                </div>
                <p class="text-danger small fw-bold mb-0">
                    <i class="fas fa-info-circle"></i> Esta ação não poderá ser desfeita.
                </p>
            </div>
            
            <!-- Rodapé com os Botões -->
            <div class="card-footer bg-white border-top-0 pt-0 pb-4 px-4 d-flex justify-content-center gap-3">
                <a href="{% url voltar_url %}" class="btn btn-light border fw-bold px-4" style="border-radius: 8px;">
                    <i class="fas fa-times me-1"></i> Cancelar
                </a>
                
                <form method="POST" action="">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger fw-bold px-4" style="border-radius: 8px; box-shadow: 0 4px 10px rgba(220, 53, 69, 0.3);">
                        <i class="fas fa-trash me-1"></i> Sim, excluir documento
                    </button>
                </form>
            </div>
            
        </div>
    </div>
</div>
{% endblock %}
