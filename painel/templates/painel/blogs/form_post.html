{% extends 'painel/base_painel.html' %}

{% block content %}
<div class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 text-gray-800 fw-bold">{{ titulo }}</h1>
            <p class="text-muted mb-0">Preencha os dados abaixo e utilize o editor moderno.</p>
        </div>
        <a href="{% url 'blogs_hub' %}" class="btn btn-outline-secondary rounded-pill px-4">
            <i class="fas fa-arrow-left me-2"></i> Voltar
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                {{ form.media }}
                
                <div class="row g-4">
                    {% for field in form %}
                    <div class="col-12 {% if field.name == 'departamento' or field.name == 'imagem_capa' or field.name == 'data_publicacao' or field.name == 'nome_autor_externo' %}col-lg-6{% endif %}">
                        <label class="form-label fw-bold" style="color: #1e3c72;">
                            {{ field.label }}
                            {% if field.field.required %}<span class="text-danger">*</span>{% endif %}
                        </label>
                        {{ field }}
                    </div>
                    {% endfor %}
                </div>

                <div class="d-flex justify-content-end mt-5 pt-4 border-top">
                    <button type="submit" class="btn btn-primary rounded-pill px-5 fw-bold" style="background-color: #1e3c72; border: none;">
                        <i class="fas fa-paper-plane me-2"></i> Publicar Artigo
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
