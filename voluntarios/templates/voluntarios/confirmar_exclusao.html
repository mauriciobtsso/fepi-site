{% extends 'painel/base_painel.html' %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow mb-4 border-left-danger">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-danger">Confirmar Exclusão</h6>
                </div>
                <div class="card-body">
                    <p class="text-gray-800">
                        Você tem certeza que deseja excluir o registro do voluntário 
                        <strong>{{ voluntario.nome }}</strong>?
                    </p>
                    <p class="small text-muted">
                        <i class="fas fa-exemption"></i> 
                        Esta ação é irreversível e removerá todos os dados e vínculos deste voluntário no sistema.
                    </p>
                    
                    <form method="post" class="mt-4">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'listar_voluntarios' %}" class="btn btn-secondary">
                                <i class="fas fa-times"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-trash"></i> Confirmar Exclusão
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
